<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS — by Site Fácil TO</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 25%,#0b2b42,#02070d 55%,#010204);color:#eefaff;font-family:Arial,sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #16425c;background:#030a11dd}.brand{display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#42c8ff;box-shadow:0 0 18px #42c8ff}.brand b{letter-spacing:3px;font-size:20px}.brand small{display:block;color:#7f9bad;font-size:8px;letter-spacing:2px;margin-top:3px}.gear{background:#091925;border:1px solid #16425c;color:white;border-radius:10px;padding:10px;font-size:17px}main{flex:1;text-align:center;padding:25px 15px}.status{font-size:10px;letter-spacing:3px;color:#72d9ff;margin-bottom:15px}.orb{width:210px;height:210px;margin:auto;display:flex;align-items:center;justify-content:center;position:relative}.orb:before,.orb:after{content:"";position:absolute;border:1px solid #23799e;border-radius:50%;inset:8px;animation:r 10s linear infinite}.orb:after{inset:28px;border-style:dashed;animation:r 7s linear infinite reverse}@keyframes r{to{transform:rotate(360deg)}}.core{width:135px;height:135px;border-radius:50%;background:radial-gradient(circle,#eaffff 0,#55d6ff 8%,#086185 30%,#031321 70%);border:2px solid #42c8ff;box-shadow:0 0 25px #42c8ff,0 0 70px #42c8ff55}.active{animation:p .8s infinite}@keyframes p{50%{transform:scale(1.06);box-shadow:0 0 35px #42c8ff,0 0 100px #42c8ff66}}.avatar{font-weight:bold;letter-spacing:2px;margin-top:8px}.sub{font-size:11px;color:#7f9bad;margin:5px 0 18px}.controls{max-width:560px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#071824;border:1px solid #16425c;color:white;border-radius:13px;padding:13px;text-align:left}.btn span{display:block;color:#7795a7;font-size:8px;letter-spacing:2px;margin-bottom:5px}.btn b{font-size:12px}.talk{grid-column:1/-1;text-align:center;background:#07304a;border-color:#42c8ff;font-weight:bold;letter-spacing:1px}.hint{font-size:10px;color:#7891a0;margin:10px}.chat{max-width:560px;margin:15px auto;display:flex;flex-direction:column;gap:8px;text-align:left}.msg{padding:10px 12px;border:1px solid #16425c;border-radius:12px;background:#06131e;font-size:13px;line-height:1.45}.user{align-self:flex-end;background:#0a3043}.sources{font-size:9px;color:#65d6ff;margin-top:6px}footer{text-align:center;color:#5e7786;font-size:9px;letter-spacing:2px;padding:12px}.overlay{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;z-index:10}.overlay.show{display:flex}.sheet{width:100%;max-width:620px;margin:auto 0 0;background:#06131f;border:1px solid #16425c;border-bottom:0;border-radius:20px 20px 0 0;padding:18px;max-height:80vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt,.close{background:#091d2b;color:white;border:1px solid #16425c;border-radius:12px;padding:12px;text-align:left}.opt.sel{border-color:#42c8ff}.opt b{display:block;font-size:12px}.opt small{color:#7891a0;font-size:9px}.close{width:100%;margin-top:12px;text-align:center}
</style></head><body><div class="app"><header><div class="brand"><i class="dot"></i><div><b>JARVIS</b><small>BY SITE FÁCIL TO</small></div></div><button class="gear" id="gear">⚙</button></header><main><div class="status" id="status">ONLINE</div><div class="orb"><div class="core" id="core"></div></div><div class="avatar" id="avatarLabel">JARVIS ORIGINAL</div><div class="sub" id="avatarSub">Assistente pessoal inteligente</div><div class="controls"><button class="btn" id="voice"><span>VOZ</span><b id="voiceName">Voz do dispositivo</b></button><button class="btn" id="appearance"><span>APARÊNCIA</span><b id="avatarName">JARVIS Original</b></button><button class="btn talk" id="talk">🎙️ FALAR COM JARVIS</button></div><div class="hint">Toque para falar. O JARVIS responderá por voz.</div><div class="chat" id="chat"></div></main><footer>JARVIS • INTELIGÊNCIA ARTIFICIAL • SITE FÁCIL TO</footer></div><div class="overlay" id="overlay"><div class="sheet"><h2 id="title">Configurações</h2><div class="opts" id="opts"></div><button class="close" id="close">Fechar</button></div></div>
<script>
const A={original:["JARVIS Original","JARVIS ORIGINAL","Assistente pessoal inteligente"],ghost:["Soldado Fantasma","SOLDADO FANTASMA","Perfil tático futurista"],spider:["Herói Aracnídeo","HERÓI ARACNÍDEO","Perfil ágil e descontraído"],armor:["Armadura Futurista","ARMADURA FUTURISTA","Perfil tecnológico"],ninja:["Ninja Sombrio","NINJA SOMBRIO","Perfil silencioso e preciso"],android:["Android","ANDROID","Perfil robótico e analítico"],agent:["Agente Futurista","AGENTE FUTURISTA","Perfil profissional"]};let av="original",voice=null;
const $=x=>document.getElementById(x);const overlay=$("overlay"),opts=$("opts");
function apply(){let a=A[av];$("avatarName").textContent=a[0];$("avatarLabel").textContent=a[1];$("avatarSub").textContent=a[2]}
function load(){let v=speechSynthesis.getVoices();if(!voice)voice=v.find(x=>/pt-BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||v[0];if(voice)$("voiceName").textContent=voice.name+" ("+voice.lang+")"}speechSynthesis.onvoiceschanged=load;load();
function sheet(type){overlay.classList.add("show");$("title").textContent=type==="voice"?"Escolha a voz":"Escolha a aparência";opts.innerHTML="";if(type==="voice"){let vs=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang));if(!vs.length)vs=speechSynthesis.getVoices();vs.slice(0,20).forEach(v=>{let b=document.createElement("button");b.className="opt"+(v===voice?" sel":"");b.innerHTML="<b>"+v.name+"</b><small>"+v.lang+"</small>";b.onclick=()=>{voice=v;load();sheet("voice")};opts.appendChild(b)})}else Object.entries(A).forEach(([k,a])=>{let b=document.createElement("button");b.className="opt"+(k===av?" sel":"");b.innerHTML="<b>"+a[0]+"</b><small>"+a[2]+"</small>";b.onclick=()=>{av=k;apply();sheet("avatar")};opts.appendChild(b)})}
$("voice").onclick=()=>sheet("voice");$("appearance").onclick=()=>sheet("avatar");$("gear").onclick=()=>sheet("avatar");$("close").onclick=()=>overlay.classList.remove("show");overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove("show")};
function add(t,c,s=[]){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;if(s.length){let x=document.createElement("div");x.className="sources";x.textContent="🔎 "+s.join(" • ");d.appendChild(x)}$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=1.08;u.pitch=.92;if(voice)u.voice=voice;u.onstart=()=>$("core").classList.add("active");u.onend=()=>$("core").classList.remove("active");speechSynthesis.speak(u)}
let rec=null,busy=false;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.lang="pt-BR";rec.interimResults=false;rec.continuous=false;rec.onstart=()=>{busy=true;$("talk").disabled=true;$("status").textContent="OUVINDO...";$("core").classList.add("active")};rec.onend=()=>{if(busy){busy=false;$("talk").disabled=false}};rec.onerror=()=>{busy=false;$("talk").disabled=false;$("core").classList.remove("active");$("status").textContent="ONLINE"};rec.onresult=async e=>{let t=e.results[0][0].transcript.trim();busy=false;$("talk").disabled=false;$("status").textContent="PROCESSANDO...";$("core").classList.remove("active");add(t,"user");await ask(t)}}else{$("talk").disabled=true}
async function ask(message){try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});let d=await r.json();if(!r.ok)throw Error(d.error||"Erro");let reply=(d.reply||"Não consegui responder.").trim();add(reply,"jarvis",d.sources||[]);speak(reply);$("status").textContent="ONLINE"}catch(e){add("Tive um problema para processar essa solicitação.","jarvis");speak("Tive um problema para processar essa solicitação.");$("status").textContent="ERRO"}}
$("talk").onclick=()=>{if(rec&&!busy){speechSynthesis.cancel();rec.start()}};apply();
</script></body></html>
