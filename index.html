<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS V2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #020408;
      color: #00bfff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }
    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .title {
      font-size: 36px;
      letter-spacing: 12px;
      margin-bottom: 28px;
      text-shadow: 0 0 18px #008cff;
    }
    .core {
      width: 190px;
      height: 190px;
      border: 2px solid #008cff;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px #008cff, inset 0 0 30px #008cff;
      transition: .25s;
    }
    .core::before, .core::after {
      content: "";
      position: absolute;
      border: 1px solid #008cff;
      border-radius: 50%;
    }
    .core::before { width: 135px; height: 135px; }
    .core::after { width: 75px; height: 75px; }
    .center {
      width: 25px;
      height: 25px;
      background: #00bfff;
      border-radius: 50%;
      box-shadow: 0 0 30px #00bfff;
      z-index: 2;
    }
    .listening {
      animation: pulse .75s infinite alternate;
    }
    .thinking {
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to {
        transform: scale(1.10);
        box-shadow: 0 0 55px #00bfff, inset 0 0 45px #008cff;
      }
    }
    .status {
      margin-top: 30px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #6fd7ff;
    }
    .message {
      margin-top: 18px;
      min-height: 76px;
      max-width: 380px;
      line-height: 1.55;
      color: #b3c7d1;
      white-space: pre-wrap;
    }
    .transcript {
      margin-top: 8px;
      min-height: 22px;
      max-width: 380px;
      color: #6d8794;
      font-size: 13px;
    }
    .button {
      margin-top: 30px;
      width: 100%;
      max-width: 310px;
      padding: 17px;
      border: 1px solid #008cff;
      border-radius: 10px;
      background: rgba(0,140,255,.08);
      color: #00bfff;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,140,255,.3);
    }
    .button:active { transform: scale(.97); }
    .button:disabled { opacity: .5; cursor: not-allowed; }
    .error { color: #ff6464; }
    .hint {
      margin-top: 18px;
      font-size: 11px;
      color: #50636c;
      max-width: 330px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="title">JARVIS</div>

    <div class="core" id="core">
      <div class="center"></div>
    </div>

    <div class="status" id="status">SISTEMA ONLINE</div>
    <div class="message" id="message">Clique no botão e fale comigo.</div>
    <div class="transcript" id="transcript"></div>

    <button class="button" id="talkButton">🎙️ FALAR COM JARVIS</button>

    <div class="hint">
      Primeira versão: voz → Gemini → resposta falada.
      Login e memória serão adicionados somente depois que o cérebro estiver funcionando.
    </div>
  </main>

  <script>
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    const core = document.getElementById("core");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const transcriptBox = document.getElementById("transcript");
    const talkButton = document.getElementById("talkButton");

    function falar(texto) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = "pt-BR";
      voz.rate = 1;
      voz.pitch = 1;

      voz.onstart = () => {
        status.textContent = "JARVIS FALANDO";
        core.classList.add("thinking");
      };

      voz.onend = () => {
        status.textContent = "JARVIS ONLINE";
        core.classList.remove("thinking");
      };

      window.speechSynthesis.speak(voz);
    }

    async function perguntarAoGemini(pergunta) {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: pergunta })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Erro ao falar com o cérebro do JARVIS.");
      }

      if (!data.reply) {
        throw new Error("O Gemini não retornou uma resposta.");
      }

      return data.reply;
    }

    if (!SpeechRecognition) {
      status.textContent = "NÃO SUPORTADO";
      message.textContent =
        "Seu navegador não oferece reconhecimento de voz. Use Chrome ou um navegador compatível.";
      message.classList.add("error");
      talkButton.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = false;
      recognition.interimResults = true;

      talkButton.addEventListener("click", () => {
        try {
          window.speechSynthesis.cancel();
          recognition.start();
          status.textContent = "OUVINDO";
          message.textContent = "Estou ouvindo...";
          transcriptBox.textContent = "";
          core.classList.add("listening");
          talkButton.textContent = "⏹️ OUVINDO...";
          talkButton.disabled = true;
        } catch (error) {
          console.error(error);
        }
      });

      recognition.onresult = async (event) => {
        let textoFinal = "";
        let textoParcial = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const texto = event.results[i][0].transcript;
          if (event.results[i].isFinal) textoFinal += texto;
          else textoParcial += texto;
        }

        const texto = (textoFinal || textoParcial).trim();

        if (texto) transcriptBox.textContent = "Você: " + texto;

        if (!textoFinal.trim()) return;

        status.textContent = "PROCESSANDO";
        message.textContent = "Pensando...";
        core.classList.remove("listening");
        core.classList.add("thinking");

        try {
          const resposta = await perguntarAoGemini(textoFinal.trim());

          core.classList.remove("thinking");
          status.textContent = "JARVIS ONLINE";
          message.textContent = resposta;
          falar(resposta);
        } catch (error) {
          console.error("JARVIS:", error);
          core.classList.remove("thinking");
          status.textContent = "ERRO";
          message.textContent = error.message;
          message.classList.add("error");
        }
      };

      recognition.onerror = (event) => {
        console.error("Voz:", event.error);
        core.classList.remove("listening");
        talkButton.disabled = false;
        talkButton.textContent = "🎙️ FALAR COM JARVIS";

        if (event.error === "not-allowed") {
          status.textContent = "MICROFONE BLOQUEADO";
          message.textContent = "Permita o acesso ao microfone no navegador.";
        } else {
          status.textContent = "ERRO DE VOZ";
          message.textContent = "Não consegui ouvir. Tente novamente.";
        }
      };

      recognition.onend = () => {
        core.classList.remove("listening");
        talkButton.disabled = false;
        talkButton.textContent = "🎙️ FALAR COM JARVIS";

        if (status.textContent === "OUVINDO") {
          status.textContent = "SISTEMA ONLINE";
          message.textContent = "Clique novamente para falar.";
        }
      };
    }
  </script>
</body>
</html>
